<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Business Suite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background: var(--bg); padding-bottom: 80px; }
        
        .no-print { max-width: 800px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        label { font-size: 12px; font-weight: bold; color: var(--primary); }

        /* Preview Area */
        #doc-preview { 
            width: 210mm; min-height: 297mm; padding: 20mm; margin: 20px auto;
            background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); color: #333; line-height: 1.5;
        }
        .header-line { border-bottom: 3px double var(--primary); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .doc-title { text-align: center; text-decoration: underline; margin: 20px 0; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        table, th, td { border: 1px solid #444; }
        th { background: #f2f2f2; padding: 8px; }
        td { padding: 8px; }

        .footer-sign { margin-top: 50px; display: flex; justify-content: flex-end; text-align: center; }
        .sign-box { width: 200px; position: relative; }
        .stamp-overlay { position: absolute; width: 120px; top: -10px; left: 20px; opacity: 0.6; pointer-events: none; }
        .sign-overlay { width: 150px; position: relative; z-index: 2; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { flex: 1; padding: 12px; border: none; background: none; cursor: pointer; font-size: 11px; text-align: center; transition: 0.2s; }
        .nav-item.active { background: var(--accent); color: white; border-radius: 8px 8px 0 0; }

        @media print {
            .no-print, .bottom-nav { display: none !important; }
            body { background: white; }
            #doc-preview { margin: 0; border: none; width: 100%; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h3>⚙️ Pengaturan & Data Tujuan</h3>
    <div class="grid-form">
        <div>
            <label>Nama Usaha Anda</label>
            <input type="text" id="my-name" placeholder="Contoh: Kreatif Tour" oninput="render()">
        </div>
        <div>
            <label>Alamat/Kontak Anda</label>
            <input type="text" id="my-info" placeholder="Alamat & No. HP" oninput="render()">
        </div>
        <div>
            <label>Nama Penerima / Perusahaan Tujuan</label>
            <input type="text" id="to-name" placeholder="Kepada Yth..." oninput="render()">
        </div>
        <div>
            <label>Alamat Tujuan</label>
            <input type="text" id="to-address" placeholder="Kota / Alamat Tujuan" oninput="render()">
        </div>
    </div>

    <div id="dynamic-inputs">
        <!-- Input spesifik dokumen akan muncul di sini -->
    </div>

    <div class="grid-form">
        <div>
            <label>Upload TTD (PNG Transparan)</label>
            <input type="file" id="in-sign" onchange="readImg(this, 'pv-sign')">
        </div>
        <div>
            <label>Upload Stempel (PNG Transparan)</label>
            <input type="file" id="in-stamp" onchange="readImg(this, 'pv-stamp')">
        </div>
    </div>

    <button onclick="window.print()" style="background:var(--accent); color:white; padding:12px; width:100%; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">
        CETAK DOKUMEN / SAVE PDF (RAWBT)
    </button>
</div>

<!-- PRIVEW DOKUMEN -->
<div id="doc-preview">
    <div class="header-line">
        <div id="pv-my-biz"><strong>NAMA USAHA ANDA</strong><br><small>Alamat & Kontak</small></div>
        <div style="text-align:right">Tanggal: <span id="pv-date">12 Mei 2026</span></div>
    </div>

    <div id="pv-target">
        Kepada Yth,<br>
        <strong id="pv-to-name">Nama Penerima</strong><br>
        <span id="pv-to-address">Alamat Tujuan</span>
    </div>

    <h3 class="doc-title" id="pv-title">INVOICE</h3>

    <div id="pv-content">
        <!-- Isi Otomatis -->
    </div>

    <div class="footer-sign">
        <div class="sign-box">
            <p>Hormat Kami,</p>
            <div style="height: 80px;">
                <img id="pv-stamp" class="stamp-overlay">
                <img id="pv-sign" class="sign-overlay">
            </div>
            <p><strong id="pv-my-name-footer">( ............................ )</strong></p>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="setMode('INVOICE')">💰<br>Invoice</button>
    <button class="nav-item" onclick="setMode('PENAWARAN')">✉️<br>Penawaran</button>
    <button class="nav-item" onclick="setMode('RAB')">📊<br>RAB</button>
    <button class="nav-item" onclick="setMode('PROPOSAL')">📄<br>Proposal</button>
    <button class="nav-item" onclick="setMode('KUITANSI')">🧾<br>Kuitansi</button>
</div>

<script>
    let currentMode = 'INVOICE';
    let items = [{desc: '', qty: 1, price: 0}];

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        setupInputs();
        render();
    }

    function setupInputs() {
        const container = document.getElementById('dynamic-inputs');
        if (currentMode === 'INVOICE' || currentMode === 'RAB') {
            container.innerHTML = `
                <label>Rincian Barang/Jasa:</label>
                <div id="items-list"></div>
                <button onclick="addItem()" style="margin-bottom:10px">+ Tambah Baris</button>
            `;
            renderItems();
        } else {
            container.innerHTML = `
                <label>Inti Pesan / Perihal:</label>
                <textarea id="main-msg" rows="4" oninput="render()" placeholder="Masukkan isi surat..."></textarea>
            `;
        }
    }

    function addItem() {
        items.push({desc: '', qty: 1, price: 0});
        renderItems();
    }

    function renderItems() {
        const list = document.getElementById('items-list');
        list.innerHTML = items.map((item, idx) => `
            <div class="grid-form" style="grid-template-columns: 2fr 1fr 1fr auto">
                <input type="text" placeholder="Deskripsi" value="${item.desc}" oninput="items[${idx}].desc=this.value; render()">
                <input type="number" placeholder="Qty" value="${item.qty}" oninput="items[${idx}].qty=this.value; render()">
                <input type="number" placeholder="Harga" value="${item.price}" oninput="items[${idx}].price=this.value; render()">
                <button onclick="items.splice(${idx},1); renderItems(); render()">X</button>
            </div>
        `).join('');
    }

    function render() {
        // Header & Tujuan
        document.getElementById('pv-my-biz').innerHTML = `<strong>${document.getElementById('my-name').value || 'NAMA USAHA'}</strong><br><small>${document.getElementById('my-info').value || 'Alamat & Kontak'}</small>`;
        document.getElementById('pv-to-name').innerText = document.getElementById('to-name').value || 'Penerima';
        document.getElementById('pv-to-address').innerText = document.getElementById('to-address').value || 'Alamat Tujuan';
        document.getElementById('pv-my-name-footer').innerText = `( ${document.getElementById('my-name').value || '................'} )`;
        document.getElementById('pv-title').innerText = currentMode;
        document.getElementById('pv-date').innerText = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});

        // Content
        const content = document.getElementById('pv-content');
        if (currentMode === 'INVOICE' || currentMode === 'RAB') {
            let total = 0;
            let rows = items.map(item => {
                let sub = item.qty * item.price;
                total += sub;
                return `<tr><td>${item.desc}</td><td align="center">${item.qty}</td><td>Rp ${item.price.toLocaleString()}</td><td>Rp ${sub.toLocaleString()}</td></tr>`;
            }).join('');
            
            content.innerHTML = `
                <table>
                    <thead><tr><th>Deskripsi</th><th>Qty</th><th>Harga Satuan</th><th>Subtotal</th></tr></thead>
                    <tbody>${rows}</tbody>
                    <tfoot><tr><th colspan="3">TOTAL</th><th>Rp ${total.toLocaleString()}</th></tr></tfoot>
                </table>
            `;
        } else if (currentMode === 'PENAWARAN') {
            const msg = document.getElementById('main-msg').value;
            content.innerHTML = `
                <p>Dengan hormat,</p>
                <p>Melalui surat ini, kami bermaksud menawarkan kerjasama/layanan sebagai berikut:</p>
                <div style="background:#f9f9f9; padding:15px; border-left:4px solid var(--accent)">${msg || '... rincian penawaran ...'}</div>
                <p>Demikian penawaran ini kami sampaikan, besar harapan kami untuk dapat bekerjasama dengan Bapak/Ibu.</p>
            `;
        } else {
            content.innerHTML = `<p style="white-space:pre-wrap;">${document.getElementById('main-msg')?.value || 'Isi dokumen...'}</p>`;
        }
    }

    function readImg(input, targetId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById(targetId).src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Init
    setupInputs();
    render();
</script>
</body>
</html>
